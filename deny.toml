# Configuration for cargo-deny (`cargo deny check`, run in CI).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  # Weak copyleft, allowed only when used unmodified (decision D11).
  "MPL-2.0",
  # The workspace's own crates.
  "AGPL-3.0-only",
]
confidence-threshold = 0.9
# The allow-list is a policy, not a record of what is used today.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# TLS policy: rustls with the ring provider only.
deny = [
  { crate = "openssl" },
  { crate = "openssl-sys" },
  { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
