[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/okoala-org/okoala"
publish = false

[workspace.dependencies]
okoala-core   = { path = "crates/core" }
okoala-secret = { path = "crates/secret" }
okoala-config = { path = "crates/config" }
zeroize = { version = "1.9.1" }
subtle = { version = "2.6.1" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
